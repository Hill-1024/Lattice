name: Native loader security tests
on:
  push:
    paths:
      - 'lattice-server/src/**/bootstrap/**'
      - 'scripts/testNativeLoader.py'
      - '.github/workflows/native-loader-tests.yml'
  pull_request:
    paths:
      - 'lattice-server/src/**/bootstrap/**'
      - 'scripts/testNativeLoader.py'
      - '.github/workflows/native-loader-tests.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/testNativeLoader.py
