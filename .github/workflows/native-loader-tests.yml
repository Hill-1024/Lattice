name: Native loader security tests
on:
  push:
    paths:
      - 'lattice-server/src/**/bootstrap/**'
      - 'scripts/testNativeLoader.py'
      - '.github/workflows/native-loader-tests.yml'
  pull_request:
    paths:
      - 'lattice-server/src/**/bootstrap/**'
      - 'scripts/testNativeLoader.py'
      - '.github/workflows/native-loader-tests.yml'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/testNativeLoader.py
