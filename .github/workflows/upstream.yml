name: Upstream
on:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # `github.event.commits` is undefined for schedule events, so the previous
      # job-level `if` never matched a real commit. Inspect HEAD instead.
      - name: Detect [ci-skip] marker
        id: skip
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%B)" == *"[ci-skip]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.skip.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        if: steps.skip.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Update upstream
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/updateUpstream.sh
          # Plain push only: a non-fast-forward refuses rather than overwriting
          # a concurrent human commit.
          git push
