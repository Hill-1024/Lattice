version: 2
updates:
  # GitHub Actions are pinned to full commit SHAs in the workflows; Dependabot
  # keeps those pins current (it updates the SHA and the trailing version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # velocity-native is required by the Paper/Paperweight dev bundle; the
      # project tracks the upstream snapshot deliberately. See the audit report
      # (V9) before changing this.
      - dependency-name: "com.velocitypowered:velocity-native"
